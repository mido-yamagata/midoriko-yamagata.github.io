<!-- Font Awesome -->
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

<style>
  /* 1) 上の白い余白を消す */
  html, body {
    margin: 0 !important;
    padding: 0 !important;
  }

  /* 2) wrapper を全幅にする（ヘッダーを端まで伸ばす） */
  .wrapper {
    width: 100% !important;
    max-width: none !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  /* 3) 本文（section/footer）だけ中央カラム */
  .wrapper section,
  .wrapper footer {
    float: none !important;
    width: auto !important;
    position: static !important;

    max-width: 1000px;
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  .wrapper section {
    border-left: 0 !important;
    padding-left: 0 !important;     /* 二重padding回避 */
    margin-top: 2.4rem;
  }

  /* 4) ヘッダーは画面端から端まで + 文字は左寄せ */
  .wrapper header {
    float: none !important;
    width: 100% !important;
    position: relative !important;  /* ::before の基準 */
    margin: 0 !important;
    border-radius: 0;
    text-align: left !important;

    /* “本文より左”に寄せたいなら左paddingを小さく */
    padding: 4.2rem 1.5rem 3.4rem 0.6rem;
    background: transparent !important; /* 背景は ::before に任せる */
  }

  /* ヘッダー背景（全幅） */
  .wrapper header::before {
    content:"";
    position:absolute;
    inset: 0;                /* top/right/bottom/left = 0 */
    width: 100%;
    background:#3cb371;       /* 濃い青緑 */
    z-index:-1;
  }

  /* ヘッダー内の文字色 */
  .wrapper header h1,
  .wrapper header p {
  .wrapper header a {
    color: #ffffff !important;
    text-align: left !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
  }

  .wrapper header h1 {
    margin: 0 0 1rem 0;
    line-height: 1.15;
  }

  .wrapper header p {
    margin: 0;
    line-height: 1.6;
    color: rgba(255,255,255,0.88) !important;
  }

  /* ヘッダー内リンク色 */
  .wrapper header a {
    color:#d7f0ff !important;
    text-decoration:none;
  }
  .wrapper header a:hover {
    color:#ffffff !important;
    text-decoration:underline;
  }

  /* 5) "View the Project on GitHub" を消す（ヘッダー内だけ） */
  .wrapper header .view,
  .wrapper header a.view,
  .wrapper header p.view {
    display: none !important;
  }

  /* 6) Contact アイコンを横並び */
  #contact-icons a {
    display: inline-block !important;
    margin-right: 0.9rem;
    text-decoration: none;
  }
  #contact-icons i.fa-solid,
  #contact-icons i.fa-brands {
    font-size: 1.6rem;
    vertical-align: middle;
  }
  
</style>
