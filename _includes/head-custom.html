<!-- Font Awesome -->
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

<style>
  /* 1) 上の白い余白を消す */
  html, body {
    margin: 0 !important;
    padding: 0 !important;
  }

  /* 2) wrapper を全幅にする（ヘッダーを端まで伸ばす） */
  .wrapper {
    width: 100% !important;
    max-width: none !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  /* 3) 本文（section/footer）だけ中央カラム */
  .wrapper section,
  .wrapper footer {
    float: none !important;
    width: auto !important;
    position: static !important;

    max-width: 1000px;
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  .wrapper section {
    border-left: 0 !important;
    padding-left: 0 !important;     /* 二重padding回避 */
    margin-top: 2.4rem;
  }

  /* 4) ヘッダーは画面端から端まで + 文字は左寄せ */
  .wrapper header {
    float: none !important;
    width: 100% !important;
    position: relative !important;  /* ::before の基準 */
    margin: 0 !important;
    border-radius: 0;
    text-align: left !important;

    /* “本文より左”に寄せたいなら左paddingを小さく */
    padding: 4.2rem 1.5rem 3.4rem 0.6rem;
    background: transparent !important; /* 背景は ::before に任せる */
  }

  /* ヘッダー背景（全幅） */
  .wrapper header::before {
    content:"";
    position:absolute;
    inset: 0;                /* top/right/bottom/left = 0 */
    width: 100%;
    background:#2f6f55;       /* 濃い青緑 */
    z-index:-1;
  }

/* ヘッダー内の文字色（白に固定） */
.wrapper header h1,
.wrapper header p,
.wrapper header a {
  color: #ffffff !important;
  text-align: left !important;
  margin-left: 0 !important;
  margin-right: 0 !important;
}

/* 説明文だけ少し柔らかい白 */
.wrapper header p {
  color: rgba(255,255,255,0.88) !important;
}

/* リンクのhover */
.wrapper header a:hover {
  text-decoration: underline;
}

  /* 5) "View the Project on GitHub" を消す（ヘッダー内だけ） */
  .wrapper header .view,
  .wrapper header a.view,
  .wrapper header p.view {
    display: none !important;
  }

  /* 6) Contact アイコンを横並び */
  #contact-icons a {
    display: inline-block !important;
    margin-right: 0.9rem;
    text-decoration: none;
  }
  #contact-icons i.fa-solid,
  #contact-icons i.fa-brands {
    font-size: 1.6rem;
    vertical-align: middle;
  }

  /* ===== 本文リンク色を「ヘッダーの緑系」に寄せる ===== */
  :root {
    --link: #2e7d5b;       /* 通常リンク（落ち着いた緑） */
    --link-hover: #1f5d43; /* hover時（少し濃い緑） */
    --link-visited: #2b6b53; /* 訪問済（濃さ控えめ） */
  }

  /* 本文のリンク（ヘッダーやContactは除外） */
  .wrapper section a,
  .wrapper footer a {
    color: var(--link) !important;
    text-decoration: none;
  }

  .wrapper section a:hover,
  .wrapper footer a:hover {
    color: var(--link-hover) !important;
    text-decoration: underline;
  }

  .wrapper section a:visited,
  .wrapper footer a:visited {
    color: var(--link-visited) !important;
  }

  /* Contact のアイコンもリンク色に合わせる（必要なら） */
  #contact-icons a {
    color: var(--link) !important;
  }
  #contact-icons a:hover {
    color: var(--link-hover) !important;
  }
</style>
